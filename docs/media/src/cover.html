<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1920px; height: 1080px; overflow: hidden; font-family: Inter, "DejaVu Sans", sans-serif; color: #ece8de;
    background: radial-gradient(1500px 1000px at 32% 40%, #24211b 0%, #14130f 55%, #0d0c09 100%); }
  .grid { position: absolute; inset: 0; opacity: 0.35;
    background-image: linear-gradient(#2f2c25 1px, transparent 1px), linear-gradient(90deg, #2f2c25 1px, transparent 1px);
    background-size: 64px 64px; mask-image: radial-gradient(900px 700px at 30% 45%, #000 0%, transparent 75%); }
  .left { position: absolute; left: 120px; top: 150px; width: 900px; }
  .brand { display: flex; align-items: center; gap: 34px; }
  .brand img { width: 168px; height: 168px; }
  .word { font-size: 150px; font-weight: 800; letter-spacing: -5px; line-height: 1; }
  .word span { color: #f2c467; }
  .tag { margin-top: 42px; font-size: 52px; line-height: 1.22; font-weight: 600; }
  .tag em { font-style: normal; color: #f2c467; }
  .stats { margin-top: 56px; display: flex; gap: 22px; }
  .stat { padding: 20px 24px; border-radius: 16px; background: #1c1a15; border: 1px solid #2f2c25; width: 280px; }
  .stat b { display: block; font-size: 52px; font-weight: 800; letter-spacing: -1.5px; }
  .stat span { display: block; margin-top: 6px; font-size: 22px; color: #a39d90; line-height: 1.3; }
  .foot { position: absolute; left: 120px; bottom: 84px; display: flex; gap: 38px; font-size: 28px; color: #a39d90; align-items: center; }
  .foot i { display: inline-block; width: 13px; height: 13px; border-radius: 7px; margin-right: 12px; }
  .shot { position: absolute; left: 1080px; top: 170px; width: 1100px; border-radius: 18px; overflow: hidden;
    border: 1px solid #3a362d; box-shadow: 0 40px 120px rgba(0,0,0,0.7); transform: perspective(1800px) rotateY(-14deg) rotateX(3deg); transform-origin: left center; }
  .bar { height: 44px; background: #1d1b17; border-bottom: 1px solid #2f2c25; display: flex; align-items: center; gap: 10px; padding: 0 16px; }
  .bar i { width: 13px; height: 13px; border-radius: 7px; display: inline-block; }
  .bar span { margin-left: 12px; font-size: 18px; color: #a39d90; }
  .shot .img { height: 640px; background-image: url("../screenshots/3-hook-card-worst-case-proved.png"); background-size: 1440px auto; background-position: -90px -150px; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="shot">
    <div class="bar"><i style="background:#ff6f61"></i><i style="background:#f2c467"></i><i style="background:#6fd3a0"></i><span>bilgin-kocak.github.io/hooktax</span></div>
    <div class="img"></div>
  </div>
  <div class="left">
    <div class="brand"><img src="../logo.png"><div class="word">Hook<span>Tax</span></div></div>
    <div class="tag">What a Uniswap v4 hook takes from your swap <em>today</em>, and what it could take <em>tomorrow</em>.</div>
    <div class="stats">
      <div class="stat"><b>11,242</b><span>v4 hooks mapped on Arkiv</span></div>
      <div class="stat"><b style="color:#ff9a91">35</b><span>could take 100% of a swap after an upgrade</span></div>
      <div class="stat"><b style="color:#f2c467">19 / 24</b><span>proved on a mainnet fork</span></div>
    </div>
  </div>
  <div class="foot">
    <span><i style="background:#ff8fd0"></i>Uniswap v4</span>
    <span><i style="background:#6fd3a0"></i>Arkiv</span>
    <span><i style="background:#8d9cff"></i>Chainlink CRE</span>
    <span style="color:#6f6a5f">ETHGlobal Mumbai 2026</span>
  </div>
</body>
</html>
