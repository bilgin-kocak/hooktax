# HookTax fork simulations (M4 measured take, M5 SneakyFeeHook worst case).
# Everything runs against a LOCAL fork of Ethereum mainnet. Nothing is ever broadcast.
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
ffi = false
# The demo and the measurement runner write raw results here; the TS runner turns them into data/sim-results.json.
fs_permissions = [{ access = "read-write", path = "../../data/cache/sim" }, { access = "read", path = "../../data" }]
# Cache fork state per block so re-runs at the pinned block are fast and use few RPC calls.
rpc_storage_caching = { chains = "all", endpoints = "all" }

[rpc_endpoints]
mainnet = "${MAINNET_FORK_RPC}"

[fmt]
line_length = 110
